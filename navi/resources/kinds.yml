namespace: $OAK_NAVI_NAMESPACE
resources:
  kinds:
    - url: /kinds.json
      status: 200
      paginated_actions:
        - resource: paginated_kinds
          pagination:
            - pages: headers['pages']
            - page_key: page
            - zero_indexed: false

  paginated_kinds:
    - url: /kinds.json?page={:page}
      status: 200
      actions:
        - resource: kind
          parameters:
            slug: parsedBody.slug

  kind:
    - url: /kinds/{:slug}.json
      status: 200
